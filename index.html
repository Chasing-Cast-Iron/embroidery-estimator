<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get an instant custom embroidery estimate for listed hat and cap items from Chasing Cast Iron." />
    <title>Custom Embroidery by Chasing Cast Iron</title>
  </head>
  <body>
    <form
      name="quote-request"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      hidden
    >
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="bot-field" />
      <input name="source" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="deadline" />
      <input name="itemType" />
      <input name="itemTypeLabel" />
      <input name="quantity" />
      <input name="designType" />
      <textarea name="textToEmbroider"></textarea>
      <input name="digitizingNeeded" />
      <input name="digitizingNeededLabel" />
      <textarea name="notes"></textarea>
      <input name="artworkFile" type="file" />
      <input name="designComplexity" />
      <input name="designComplexityLabel" />
      <input name="estimateSummary" />
      <textarea name="estimateDetails"></textarea>
      <input name="hatchFontName" />
      <input name="hatchFontCategory" />
      <input name="hatchFontSizeRange" />
      <input name="hatchFontJoinMethod" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
